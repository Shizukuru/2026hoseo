<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9EC">
<title>2026 초등학교 방과후 프로그램(방학집중형) 출결</title>
<!-- ★★★ 여기 한 줄만 고치면 됩니다 ★★★
     Apps Script [배포 > 배포 관리]의 웹 앱 URL (https://script.google.com/macros/s/…/exec) 을 따옴표 안에 붙여넣으세요. -->
<script>window.NB_API_URL = 'https://script.google.com/macros/s/AKfycbwIR0psD16V3LSKF_qbiSpVhev2heQ9W4JgzEcTj4Z0hN5SIVtO154UqdYmWRvpgT257A/exec';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFF9EC; --surface:#FFFFFF; --surface-2:#F6F1E4; --fg:#1E2A44; --fg-muted:#5E6780; --line:#EADFC8;
  --accent:#1F78D1; --accent-ink:#fff; --accent-soft:#DDEBFB;
  --mark:#FFC93C; --mark-ink:#3A2A05;
  --ok:#1C8A50; --ok-soft:#DDF4E6; --abs:#D23B30; --abs-soft:#FDE4E1; --warn:#B45F06; --warn-soft:#FFEBD2;
  --neutral:#6E7488; --neutral-soft:#EEEBF3;
  --fun1:#FF6B6B; --fun2:#FFC93C; --fun3:#3CCB8B; --fun4:#4DA3FF; --fun5:#A98BFF;
  --font-display:'Do Hyeon','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --radius:16px; --shadow:0 1px 2px rgba(30,42,68,.06),0 10px 22px -16px rgba(30,42,68,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:5px;z-index:70;background:linear-gradient(90deg,var(--fun1) 0 20%,var(--fun2) 20% 40%,var(--fun3) 40% 60%,var(--fun4) 60% 80%,var(--fun5) 80%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px}
.wrap.wide{max-width:980px}
.muted{color:var(--fg-muted)}
.small{font-size:14px}
.xs{font-size:12.5px}

/* 헤더 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;flex:none;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px}
.brand-name{font:21px/1.2 var(--font-display);color:var(--accent)}
.brand-sub{font-size:13px;color:var(--fg-muted);margin-top:2px}
.top-act{display:flex;gap:6px;flex:none}

/* 공통 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:14px}
.stack > * + *{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:600;background:var(--surface-2);color:var(--fg);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.abs{background:var(--abs);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.line{background:var(--surface);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{display:block}
.field + .field{margin-top:12px}
.field > span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field > span em{font-style:normal;color:var(--fg-muted);font-weight:400}
.input{width:100%;min-height:50px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:17px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:76px;resize:vertical;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--fg-muted)}
.note b{color:var(--fg)}
.note.warn{background:var(--warn-soft);color:#6B3A05}
.sec-title{font:20px/1.2 var(--font-display);margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-title .xs{font-family:var(--font-body)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:600;color:var(--fg-muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.abs{background:var(--abs-soft);color:var(--abs)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.neutral{background:var(--neutral-soft);color:var(--neutral)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:28px 12px;color:var(--fg-muted)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px 0;text-align:center;color:var(--fg-muted)}

/* 학부모 첫 화면 */
.hero{padding:6px 0 18px}
.hero h1{font:30px/1.2 var(--font-display);margin-bottom:6px}
.hero p{color:var(--fg-muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.steps div{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--fg-muted);text-align:center}
.steps b{display:block;font:22px var(--font-display);color:var(--accent)}
.reg-cta{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* 수업 일정 (학부모) */
.day{margin-top:18px}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.day-h h3{font:19px var(--font-display)}
.day-h h3 .today{display:inline-block;background:var(--mark);color:var(--mark-ink);border-radius:999px;padding:1px 9px;font:600 12.5px var(--font-body);margin-left:6px;vertical-align:3px}
.ses{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.ses + .ses{margin-top:8px}
.ses.sel{border-color:var(--abs);background:#FFF6F5}
.ses .tm{font:600 15px/1.25 var(--font-body);text-align:center}
.ses .tm small{display:block;font-weight:400;font-size:12.5px;color:var(--fg-muted)}
.ses .nm{font-weight:700;line-height:1.3}
.ses .meta{font-size:13px;color:var(--fg-muted);margin-top:2px}
.ses .meta .kid{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-weight:600;margin-right:4px}
.ses .rep{font-size:13px;color:var(--abs);margin-top:4px}
.ses .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pick{min-height:44px;min-width:92px;border-radius:12px;border:1.5px solid var(--abs);background:#fff;color:var(--abs);font-weight:700;padding:0 12px}
.pick[aria-pressed="true"]{background:var(--abs);color:#fff}
.past-toggle{margin-top:22px}
.kid-cls{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:14.5px}
.kid-cls:first-of-type{border-top:0}
.kid-card .kid-h{padding-bottom:6px}
.kid-card .kid-h + .kid-cls{border-top:1px dashed var(--line)}

/* 하단 고정 바 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock b{color:var(--abs)}

/* 모달 */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,28,46,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font:23px var(--font-display);margin-bottom:10px}
.sel-list{list-style:none;margin:0 0 14px;padding:0;font-size:14.5px}
.sel-list li{padding:6px 0;border-bottom:1px dashed var(--line)}
.sheet-act{display:flex;gap:8px;margin-top:16px}
.sheet-act .btn{flex:1}
.res-list{list-style:none;padding:0;margin:0}
.res-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--fg);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
#toast.err{background:var(--abs)}

/* 수강 등록 */
.cls-opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;cursor:pointer}
.cls-opt + .cls-opt{margin-top:8px}
.cls-opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.cls-opt.on{border-color:var(--accent);background:#F6FAFF}
.cls-opt.dis{opacity:.5;cursor:not-allowed}
.cls-opt .nm{font-weight:700}
.cls-opt .meta{font-size:13.5px;color:var(--fg-muted)}
.term-h{font:18px var(--font-display);color:var(--accent);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px dashed var(--line)}
.term-h:first-child{margin-top:0}
.tbd{color:var(--warn);font-weight:600}
.cls-opt .desc{font-size:14px;line-height:1.45;color:var(--fg);margin:3px 0 4px}
.reg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.reg-grid .field + .field{margin-top:0}

/* 강사 · 관리자 */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.datebar .d{font:22px var(--font-display);flex:1;text-align:center;min-width:150px}
.datebar .d small{font:600 12.5px var(--font-body);background:var(--mark);color:var(--mark-ink);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:4px}
.datebar input[type=date]{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff}
.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.cls{margin-top:14px;padding:0;overflow:hidden}
.cls-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;cursor:default;width:100%;background:none;border:0;text-align:left}
.cls-h.tog{cursor:pointer}
.cls-h h3{font:21px/1.2 var(--font-display)}
.cls-h .meta{font-size:13.5px;color:var(--fg-muted);margin-top:3px}
.counts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.cls-b{border-top:1px solid var(--line);padding:12px 18px 16px}
.cls-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.ros{list-style:none;margin:0;padding:0}
.ros li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.ros li:first-child{border-top:0}
.ros .no{color:var(--fg-muted);font-size:13px;text-align:right}
.ros .who b{font-size:16.5px}
.ros .who .gb{font-size:13px;color:var(--fg-muted);margin-left:6px}
.ros .rep{margin-top:4px;font-size:13.5px;color:var(--abs);background:var(--abs-soft);border-radius:8px;padding:4px 8px;display:inline-block}
.ros .ph{font-size:12.5px;color:var(--fg-muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{min-height:44px;min-width:58px;border:0;background:transparent;font-weight:700;color:var(--fg-muted);padding:0 10px}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button.on.p{background:var(--ok);color:#fff}
.seg button.on.a{background:var(--abs);color:#fff}
.seg button:disabled{opacity:.4}
.ros li.reported .who b{color:var(--abs)}
.up{list-style:none;margin:0;padding:0;font-size:14.5px}
.up li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.up li:first-child{border-top:0}
.up .dt{font-weight:700;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12.5px;color:var(--fg-muted);font-weight:600}
.pinbox{font:28px var(--font-display);letter-spacing:.3em;text-align:center}
.foot{margin-top:40px;text-align:center;font-size:12.5px;color:var(--fg-muted)}
.foot a{color:var(--fg-muted)}
@media (max-width:420px){
  .ses{grid-template-columns:52px 1fr;}
  .ses .act{grid-column:1 / -1;flex-direction:row;justify-content:flex-end;align-items:center}
  .pick{min-width:0;flex:1}
  .ros li{grid-template-columns:20px 1fr auto;gap:8px}
  .seg button{min-width:52px;padding:0 8px}
  .brand-name{font-size:18px}
  .brand-mark{width:34px;height:34px}
  .datebar .d{font-size:20px;min-width:0}
  .datebar input[type=date]{flex-basis:100%}
  .cls-h{flex-direction:column}
  .counts{justify-content:flex-start}
  .steps div{font-size:12px}
}
@media (max-width:340px){.ros li{grid-template-columns:20px 1fr}.ros li .seg{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" class="wrap"><div class="loading"><span class="spin"></span> 불러오는 중…</div></main>
<div id="modal"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<script>
(function () {
'use strict';
/* ───────── 서버 연결 ───────── */
const API_URL = String(window.NB_API_URL || '');
const API_PROBLEM = !API_URL || /배포ID/.test(API_URL) ? 'index.html 맨 위 NB_API_URL 에 Apps Script 웹 앱 주소(…/exec)가 아직 입력되지 않았습니다.'
  : !/^(https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec|https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/.*)$/.test(API_URL) ? 'NB_API_URL 이 https://script.google.com/macros/s/…/exec 꼴이 아닙니다.' : '';
async function rpc(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (API_PROBLEM) throw new Error(API_PROBLEM);
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 45000);
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow', cache: 'no-store', signal: ctrl.signal });
  } catch (e) { throw new Error(e && e.name === 'AbortError' ? '서버 응답이 없습니다. 잠시 후 다시 시도해 주세요.' : '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'); }
  finally { clearTimeout(tm); }
  let j = null; try { j = JSON.parse(await r.text()); } catch (x) { /* */ }
  if (!j || typeof j !== 'object') throw new Error('서버가 데이터 대신 다른 화면을 보냈습니다. Apps Script 배포의 액세스 권한이 "모든 사용자"인지 확인해 주세요.');
  if (j.ok !== true) throw new Error(j.error || '서버 오류');
  return j.data;
}

/* ───────── 도우미 ───────── */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = '일월화수목금토';
function dowOf(ymd) { const p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
function md(ymd) { const p = ymd.split('-').map(Number); return p[1] + '월 ' + p[2] + '일 (' + DOW[dowOf(ymd)] + ')'; }
function mdShort(ymd) { const p = ymd.split('-').map(Number); return p[1] + '/' + p[2] + '(' + DOW[dowOf(ymd)] + ')'; }
function addDays(ymd, n) { const p = ymd.split('-').map(Number); const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return d.toISOString().slice(0, 10); }
function stamp(s) { const m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(s || ''); return m ? Number(m[1]) + '/' + Number(m[2]) + ' ' + m[3] + ':' + m[4] : ''; }
function fmtPhone(v) { const d = String(v || '').replace(/\D/g, '').slice(0, 11); return d.length < 4 ? d : d.length < 8 ? d.slice(0, 3) + '-' + d.slice(3) : d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(-4); }
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* */ } } };
let toastT = null;
function toast(msg, err) { const el = $('#toast'); el.textContent = msg; el.className = err ? 'err' : ''; clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hidden'), err ? 4500 : 2600); }
function modal(html) { $('#modal').innerHTML = html ? '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>' : ''; const f = $('#modal [autofocus]') || $('#modal .sheet'); if (f && f.focus) f.focus(); }
function busy(btn, on) { if (!btn) return; if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; } else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; } }
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg>';

/* ───────── 상태 ───────── */
const S = { pub: null, view: '', parent: null, pdata: null, kid: 'all', sel: new Set(), showPast: false, showCls: true, reg: { kid: '', grade: '', ban: '', phone: '', guardian: '', ids: new Set() },
  pin: '', sdata: null, date: '', open: {}, tab: 'roster', timer: null };
const PAGE = new URLSearchParams(location.search).get('page') || '';
const app = $('#app');

function header(sub, right) {
  const p = S.pub || {};

async function doLogin(name, phone, remember, keepSel) {
  const data = await rpc('parentLogin', name, phone);
  S.parent = { name: name, phone: phone };
  if (remember) { store.set('nb.parent', { name: name, phone: phone }); store.del('nb.parent.no'); }
  else if (remember === false) { store.del('nb.parent'); store.set('nb.parent.no', 1); }
  S.pdata = data;
  // 새로고침 중에 고른 수업은 응답이 온 뒤에도 유지 (아직 신청할 수 있는 것만)
  if (keepSel) { const ok = new Set(data.sessions.filter(s => s.canReport && !s.report).map(key)); Array.from(S.sel).forEach(k => { if (!ok.has(k)) S.sel.delete(k); }); }
  else S.sel.clear();
  if (S.kid !== 'all' && !data.kids.some(k => k.name === S.kid)) S.kid = 'all';
  renderMy();
}

/* ───────── 학부모: 내 아이 수업 ───────── */
function renderMy() {
  S.view = 'my';
  const d = S.pdata;
  const today = d.now.date;
  const multi = d.kids.length > 1;
  const kidOk = (n) => S.kid === 'all' || S.kid === n;
  const list = d.sessions.filter(s => kidOk(s.kid));
  const up = list.filter(s => !s.past), past = list.filter(s => s.past).reverse();
  const byDay = {};
  up.forEach(s => { (byDay[s.date] = byDay[s.date] || []).push(s); });
  let h = header(d.kids.map(k => k.name).join(' · ') + ' 보호자님', '<button class="btn sm line" data-act="refresh" aria-label="새로고침">새로고침</button><button class="btn sm line" data-act="logout">나가기</button>');
  if (multi) h += '<div class="chips" role="group" aria-label="자녀 선택"><button class="chip" data-act="kid" data-kid="all" aria-pressed="' + (S.kid === 'all') + '">모두</button>' + d.kids.map(k => '<button class="chip" data-act="kid" data-kid="' + esc(k.name) + '" aria-pressed="' + (S.kid === k.name) + '">' + esc(k.name) + '</button>').join('') + '</div>';
  // ① 수강 내역 — 로그인하면 맨 먼저 보임 (수강 등록은 학교에서 해 줌)
  h += '<h2 class="sec-title">수강 내역 <button class="linkbtn xs" data-act="cls-tog">' + (S.showCls ? '접기' : '펼치기') + '</button></h2>';
  if (S.showCls) {
    h += d.kids.filter(k => kidOk(k.name)).map(k => '<div class="card kid-card"><div class="kid-h"><b>' + esc(k.name) + '</b> <span class="small muted">' + k.grade + '학년' + (k.ban ? ' ' + esc(k.ban) + '반' : '') + ' · ' + k.classes.length + '개 수업</span></div>' +
      k.classes.map(c => {
        const t = c.tot || {};
        const sum = (t.p ? '<span class="badge ok">출석 ' + t.p + '</span>' : '') + (t.a ? '<span class="badge abs">결석 ' + t.a + '</span>' : '') + (t.rep ? '<span class="badge warn">결석 신고 ' + t.rep + '</span>' : '');
        return '<div class="kid-cls"><div style="min-width:0"><b>' + esc(c.name) + '</b>' + (c.desc ? '<div class="xs" style="margin-top:2px">' + esc(c.desc) + '</div>' : '') +
          '<div class="xs muted" style="margin-top:2px">' + (c.term ? esc(c.term) + ' · ' : '') + (c.start ? esc(c.days) + ' ' + esc(c.start) + '–' + esc(c.end) : '일정 추후 안내') + (c.place ? ' · ' + esc(c.place) : '') + (c.teacher ? ' · ' + esc(c.teacher) : '') + '</div>' +
          (c.from ? '<div class="xs muted">' + esc(c.from.replace(/-/g, '.')) + ' ~ ' + esc((c.to || '').replace(/-/g, '.')) + '</div>' : '') +
          (sum ? '<div class="counts" style="justify-content:flex-start;margin-top:6px">' + sum + '</div>' : '') + '</div>' + statusBadge(c.status) + '</div>';
      }).join('') + '</div>').join('');
  }
  // ② 수업 일정 · 결석 신고
  h += '<h2 class="sec-title">수업 일정 · 결석 신고</h2>';
  h += '<p class="small muted">못 가는 수업의 <b style="color:var(--abs)">[결석]</b> 버튼을 누른 뒤 아래 <b>[결석 신청]</b>을 눌러 주세요. 여러 개를 한 번에 고를 수 있어요. 수업이 끝나면 선생님이 체크한 출결이 보여요.</p>';
  const days = Object.keys(byDay).sort();
  if (!days.length) h += '<div class="card empty" style="margin-top:14px">' + (d.kids.some(k => k.classes.some(c => !c.start)) ? '수업 일정이 아직 정해지지 않았어요. 일정이 나오면 여기에 보여요.' : '앞으로 예정된 수업이 없어요.') + '</div>';
  days.forEach(day => {
    const ss = byDay[day];
    const selectable = ss.filter(s => s.canReport && !s.report);
    const allOn = selectable.length && selectable.every(s => S.sel.has(key(s)));
    h += '<section class="day"><div class="day-h"><h3>' + md(day) + (day === today ? '<span class="today">오늘</span>' : day === addDays(today, 1) ? '<span class="today" style="background:var(--accent-soft);color:var(--accent)">내일</span>' : '') + '</h3>' +
      (selectable.length > 1 ? '<button class="linkbtn small" data-act="pick-day" data-day="' + day + '">' + (allOn ? '선택 해제' : '이 날 모두 결석') + '</button>' : '') + '</div>' +
      ss.map(s => sesRow(s, multi && S.kid === 'all')).join('') + '</section>';
  });
  if (past.length) {
    h += '<button class="btn line block past-toggle" data-act="past">' + (S.showPast ? '지난 수업 출결 접기' : '지난 7일 출결 보기 (' + past.length + ')') + '</button>';
    if (S.showPast) h += '<div style="margin-top:10px">' + past.map(s => sesRow(s, multi && S.kid === 'all', true)).join('') + '</div>';
  }
  if (d.contact) h += '<div class="note" style="margin-top:16px">신고 마감이 지났거나, 수강 내역이 다르거나, 수업을 그만두려면 <a href="tel:' + esc(d.contact) + '">' + esc(d.contact) + '</a> 로 연락해 주세요.</div>';
  h += footer();
  app.className = 'wrap';
  app.innerHTML = h;
  renderDock();
}
const key = (s) => s.date + '|' + s.eid;
function statusBadge(st) { return st === '수강' ? '<span class="badge ok">수강 중</span>' : st === '대기' ? '<span class="badge warn">승인 대기</span>' : '<span class="badge neutral">' + esc(st) + '</span>'; }
function sesRow(s, multi, isPast) {
  const k = key(s);
  const on = S.sel.has(k);
  let act = '', rep = '';
  if (s.report) rep = '<div class="rep">결석 신청함 · ' + esc(s.reason) + (s.memo ? ' · ' + esc(s.memo) : '') + '</div>';
  if (s.past || isPast) {
    act = s.att === '출석' ? '<span class="badge ok">출석</span>' : s.att === '결석' ? '<span class="badge abs">결석</span>' : s.report ? '<span class="badge abs">결석 신청</span>' : '<span class="badge neutral">확인 전</span>';
  } else if (s.canReport) {
    act = s.report ? '<span class="badge abs">결석 신청됨</span><button class="linkbtn xs" data-act="cancel" data-k="' + esc(k) + '">신청 취소</button>'
      : '<button class="pick" data-act="pick" data-k="' + esc(k) + '" aria-pressed="' + on + '">' + (on ? '✓ 결석' : '결석') + '</button>';
  } else {
    act = s.att === '출석' ? '<span class="badge ok">출석</span>' : s.att === '결석' ? '<span class="badge abs">결석</span>' : s.report ? '<span class="badge abs">결석 신청됨</span>' : '<span class="badge neutral">수업 중 · 마감</span>';
  }
  return '<div class="ses' + (on ? ' sel' : '') + '"><div class="tm">' + esc(s.start) + '<small>' + esc(s.end) + '</small></div><div><div class="nm">' + esc(s.className) + '</div><div class="meta">' + (multi ? '<span class="kid">' + esc(s.kid) + '</span>' : '') + (isPast ? mdShort(s.date) + ' · ' : '') + esc(s.place || '') + '</div>' + rep + '</div><div class="act">' + act + '</div></div>';
}
function renderDock() {
  let el = $('#dock');
  if (S.view !== 'my' || !S.sel.size) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'dock'; el.className = 'dock'; document.body.appendChild(el); }
  el.innerHTML = '<div class="dock-in"><span><b>' + S.sel.size + '개</b> 수업 선택</span><span style="display:flex;gap:8px"><button class="btn line sm" data-act="clear-sel">취소</button><button class="btn abs" data-act="open-report">결석 신청</button></span></div>';
}
function selectedSessions() { return S.pdata.sessions.filter(s => S.sel.has(key(s))); }
function openReport() {
  const list = selectedSessions();
  if (!list.length) return;
  const multi = S.pdata.kids.length > 1;
  const reasons = S.pdata.reasons || [];
  modal('<h2>결석 신청</h2><ul class="sel-list">' + list.map(s => '<li><b>' + mdShort(s.date) + ' ' + esc(s.start) + '</b> ' + esc(s.className) + (multi ? ' · ' + esc(s.kid) : '') + '</li>').join('') + '</ul>' +
    '<div class="field"><span>사유</span><div class="chips" role="radiogroup">' + reasons.map((r, i) => '<button class="chip" role="radio" data-act="reason" data-r="' + esc(r) + '" aria-pressed="false" aria-checked="false"' + (i === 0 ? ' autofocus' : '') + '>' + esc(r) + '</button>').join('') + '</div></div>' +
    '<label class="field"><span>선생님께 한마디 <em>(선택, 100자)</em></span><textarea class="input" id="memo" maxlength="100" placeholder="예: 열이 나서 집에서 쉬어요"></textarea></label>' +
    '<div class="sheet-act"><button class="btn line" data-act="close">닫기</button><button class="btn abs" data-act="send-report" disabled>신청하기</button></div>');
}
async function sendReport(btn) {
  const reason = ($('#modal .chip[aria-pressed="true"]') || {}).dataset; if (!reason) return;
  const items = selectedSessions().map(s => ({ eid: s.eid, date: s.date }));
  busy(btn, true);
  try {
    const r = await rpc('reportAbsence', S.parent.name, S.parent.phone, items, reason.r, $('#memo').value);
    const bad = r.results.filter(x => !x.ok);
    S.sel.clear(); modal('');
    toast(bad.length ? r.done + '개 신청 완료 · ' + bad.length + '개는 마감이 지나 신청하지 못했어요' : '결석 신청을 보냈어요. 선생님 출석부에 바로 표시돼요.', !!bad.length && !r.done);
    await refreshMy();
  } catch (e) { busy(btn, false); toast(e.message, true); }
}
async function cancelReport(k) {
  const s = S.pdata.sessions.find(x => key(x) === k); if (!s) return;
  modal('<h2>결석 신청을 취소할까요?</h2><p>' + md(s.date) + ' ' + esc(s.start) + ' <b>' + esc(s.className) + '</b>' + (S.pdata.kids.length > 1 ? ' · ' + esc(s.kid) : '') + '</p><p class="small muted" style="margin-top:6px">취소하면 출석 예정으로 바뀝니다.</p><div class="sheet-act"><button class="btn line" data-act="close" autofocus>아니요</button><button class="btn primary" data-act="do-cancel" data-k="' + esc(k) + '">신청 취소</button></div>');
}
async function doCancel(btn, k) {
  const s = S.pdata.sessions.find(x => key(x) === k); if (!s) return;
  busy(btn, true);
  try {
    const r = await rpc('cancelAbsence', S.parent.name, S.parent.phone, [{ eid: s.eid, date: s.date }]);
    modal(''); toast(r.done ? '결석 신청을 취소했어요.' : (r.results[0] && r.results[0].msg) || '취소하지 못했어요.', !r.done);
    await refreshMy();
  } catch (e) { busy(btn, false); toast(e.message, true); }
}
async function refreshMy(btn) {
  if (!S.parent) return;
  busy(btn, true);
  try { await doLogin(S.parent.name, S.parent.phone, undefined, true); }
  catch (e) { toast(e.message, true); busy(btn, false); }
}

/* ───────── 관리자: 수강 등록 · 수강생 명단 ───────── */
// 학부모는 수강 등록을 하지 않음. 관리자가 여기(또는 스프레드시트 [수강] 탭)에서 등록하면, 학부모는 자녀 이름 + 휴대폰 뒷번호 4자리로 로그인
function regFormHTML() {
  const r = S.reg;
  return '<form id="regForm" class="card" style="margin-top:14px" autocomplete="off"><h2 style="font:21px var(--font-display);margin-bottom:4px">수강 등록</h2>' +
    '<p class="small muted" style="margin-bottom:14px">여기서 등록하면 학부모는 <b>학생 이름 + 보호자 휴대폰 뒷번호 4자리</b>로 바로 로그인할 수 있어요. 인원이 많으면 스프레드시트 [수강] 탭에 명단을 붙여넣어도 돼요 (수업ID 대신 수업명만 적어도 됨).</p>' +
    '<div class="reg-grid"><label class="field"><span>학생 이름</span><input class="input" name="kid" required maxlength="20" value="' + esc(r.kid) + '" placeholder="예: 김하나"></label>' +
    '<label class="field"><span>학년</span><select class="input" name="grade" required><option value="">고르기</option>' + [1, 2, 3, 4, 5, 6].map(g => '<option value="' + g + '"' + (String(g) === r.grade ? ' selected' : '') + '>' + g + '학년</option>').join('') + '</select></label>' +
    '<label class="field"><span>반 <em>(숫자)</em></span><input class="input" name="ban" inputmode="numeric" maxlength="2" value="' + esc(r.ban) + '" placeholder="예: 3"></label>' +
    '<label class="field"><span>보호자 휴대폰 <em>(전체 번호)</em></span><input class="input" name="phone" required inputmode="numeric" maxlength="13" value="' + esc(fmtPhone(r.phone)) + '" placeholder="010-0000-0000" data-phone></label>' +
    '<label class="field"><span>보호자 이름 <em>(선택)</em></span><input class="input" name="guardian" maxlength="20" value="' + esc(r.guardian) + '"></label></div>' +
    '<div class="field" style="margin-top:16px"><span>수업 고르기 <em id="clsHint"></em></span><div id="clsList"></div></div>' +
    '<button class="btn primary block" type="submit" id="regBtn" style="margin-top:16px">등록하기</button></form>';
}
function renderClsList() {
  const box = $('#clsList'); if (!box) return;
  const g = Number(S.reg.grade);
  const all = (S.sdata && S.sdata.regClasses) || [];
  // 학년을 고르기 전에는 모든 수업을 보여 주고, 고르면 그 학년이 들을 수 있는 수업만 남김
  if (!all.length) { $('#clsHint').textContent = ''; box.innerHTML = '<div class="empty small">등록할 수 있는 수업이 없어요.<br><span class="xs">스프레드시트 메뉴 [늘봄 결석 > 수업 목록 점검]으로 확인해 주세요.</span></div>'; return; }
  const ok = g ? all.filter(c => gradeOk(c.grade, g)) : all.slice();
  const hidden = all.length - ok.length;
  Array.from(S.reg.ids).forEach(id => { if (!ok.some(c => c.id === id)) S.reg.ids.delete(id); });
  $('#clsHint').textContent = g ? g + '학년이 들을 수 있는 수업 ' + ok.length + '개' + (hidden ? ' (다른 학년 수업 ' + hidden + '개는 숨김)' : '') : '수업 ' + all.length + '개 · 위에서 학년을 고르면 들을 수 있는 수업만 남아요.';
  let lastTerm = null;
  box.innerHTML = ok.length ? ok.map(c => {
    const termH = (c.term || '') !== lastTerm ? (lastTerm = c.term || '', c.term ? '<div class="term-h">' + esc(c.term) + '</div>' : '') : '';
    const full = c.cap && c.count >= c.cap; const on = S.reg.ids.has(c.id);
    const left = c.cap ? (full ? '<span class="badge neutral">정원 마감</span>' : '<span class="badge ' + (c.cap - c.count <= 3 ? 'warn' : 'info') + '">' + (c.cap - c.count) + '자리 남음</span>') : '';

    case 'reload': location.reload(); break;
    case 'close': modal(''); break;
    case 'home': nav(''); break;
    case 'back': history.length > 1 ? history.back() : nav(''); break;
    case 'logout': store.del('nb.parent'); S.parent = null; S.pdata = null; S.sel.clear(); renderDock(); renderHome(); break;
    case 'refresh': refreshMy(t); break;
    case 'kid': S.kid = t.dataset.kid; S.sel.clear(); renderMy(); break;
    case 'past': S.showPast = !S.showPast; renderMy(); break;
    case 'cls-tog': S.showCls = !S.showCls; renderMy(); break;
    case 'pick': { const k = t.dataset.k; S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k); renderMy(); break; }
    case 'pick-day': {
      const ss = S.pdata.sessions.filter(s => s.date === t.dataset.day && s.canReport && !s.report && (S.kid === 'all' || s.kid === S.kid));
      const all = ss.every(s => S.sel.has(key(s))); ss.forEach(s => all ? S.sel.delete(key(s)) : S.sel.add(key(s))); renderMy(); break;
    }
    case 'clear-sel': S.sel.clear(); renderMy(); break;
    case 'open-report': openReport(); break;
    case 'reason': $$('#modal [data-act="reason"]').forEach(b => { const on = b === t; b.setAttribute('aria-pressed', on); b.setAttribute('aria-checked', on); }); $('#modal [data-act="send-report"]').disabled = false; break;
    case 'send-report': sendReport(t); break;
    case 'cancel': cancelReport(t.dataset.k); break;
    case 'do-cancel': doCancel(t, t.dataset.k); break;
    case 'reg-next': { const r = S.reg; r.kid = ''; r.grade = ''; r.ban = ''; modal(''); renderStaff(); const k = $('#regForm [name=kid]'); if (k) k.focus(); break; }
    case 'reg-new': S.reg = { kid: '', grade: '', ban: '', phone: '', guardian: '', ids: new Set() }; modal(''); renderStaff(); break;
    case 'enr-st': busy(t, true); try { await rpc('setEnrollStatus', S.pin, t.dataset.eid, t.dataset.st); const e = S.sdata.enrollments.find(x => x.eid === t.dataset.eid); if (e) e.status = t.dataset.st; toast(t.dataset.st === '취소' ? '수강 취소했어요. 출석부와 학부모 화면에서 빠져요.' : '다시 수강 중으로 바꿨어요.'); renderEnrList(); } catch (e) { busy(t, false); toast(e.message, true); } break;
    // 강사·관리자
    case 's-refresh': loadStaff(t); break;
    case 's-logout': store.del(PIN_KEY); S.pin = ''; S.sdata = null; S.date = ''; renderPin(); break;
    case 'day': S.date = addDays(S.date, Number(t.dataset.n)); loadStaff(t); break;
    case 'today': S.date = ''; loadStaff(t); break;
    case 'goto': S.date = t.dataset.d; loadStaff(t); break;
    case 'toggle': S.open[t.dataset.id] = !S.open[t.dataset.id]; renderStaff(); break;
    case 'tab': S.tab = t.dataset.tab; renderStaff(); break;
    case 'mark': mark(t); break;
    case 'bulk': bulk(t); break;
    case 'approve': busy(t, true); try { await rpc('setEnrollStatus', S.pin, t.dataset.eid, t.dataset.st); toast(t.dataset.st === '수강' ? '승인했어요.' : '거절했어요.'); await loadStaff(null); } catch (e) { busy(t, false); toast(e.message, true); } break;
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.act === 'pickdate' && t.value) { S.date = t.value; loadStaff(null); }
  if (t.name === 'grade' && $('#regForm')) { S.reg.grade = t.value; renderClsList(); }
  if (t.dataset.cls) { t.checked ? S.reg.ids.add(t.dataset.cls) : S.reg.ids.delete(t.dataset.cls); t.closest('.cls-opt').classList.toggle('on', t.checked); }
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'enrQ') { S.q = ev.target.value; renderEnrList(); return; } if (ev.target.hasAttribute('data-phone')) { const el = ev.target; const v = fmtPhone(el.value); if (v !== el.value) el.value = v; } });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('#modal .scrim')) modal(''); });
document.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'loginForm') {
    const fd = new FormData(f); const btn = f.querySelector('[type=submit]'); busy(btn, true);
    try { await doLogin(String(fd.get('kid')).trim(), String(fd.get('phone')), !!fd.get('remember')); }
    catch (e) { busy(btn, false); toast(e.message, true); }
  }
  if (f.id === 'regForm') submitReg(f);
  if (f.id === 'pinForm') {
    const fd = new FormData(f); S.pin = String(fd.get('pin')).trim();
    if (fd.get('remember')) store.set(PIN_KEY, S.pin);
    await loadStaff(f.querySelector('[type=submit]'));
    if (S.view === 'staff') startPoll();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.view === 'staff') loadStaff(null, true); });

/* ───────── 화면 이동 ───────── */
function nav(view, mode) {
  history.pushState({ view: view, mode: mode }, '', view ? '?page=' + view : location.pathname);
  show(view, mode);
}
window.addEventListener('popstate', (e) => { modal(''); show((e.state && e.state.view) || (new URLSearchParams(location.search).get('page') || ''), e.state && e.state.mode); });
function show(view, mode) {
  window.scrollTo(0, 0); $('#toast').classList.add('hidden');
  if (S.pdata) return renderMy();
  renderHome();
}

async function boot() {
  if (PAGE === 't' || PAGE === 'admin') {
    document.title = (IS_ADMIN ? '관리자' : '강사 출석부') + ' · ' + '2026 초등학교 방과후 프로그램(방학집중형) 출결';
    S.pub = await rpc('getPublic').catch(() => null) || { name: '2026 초등학교 방과후 프로그램(방학집중형) 출결' };
    S.pin = store.get(PIN_KEY) || '';
    if (S.pin) { app.innerHTML = '<div class="loading"><span class="spin"></span> 출석부 불러오는 중…</div>'; await loadStaff(null); if (S.view === 'staff') startPoll(); else if (S.view !== 'pin') renderPin(); }
    else renderPin();
    return;
  }
  try { S.pub = await rpc('getPublic'); }
  catch (e) { app.innerHTML = header() + errBox(e.message); return; }
  if (S.pub.name) document.title = S.pub.name + (S.pub.school ? ' · ' + S.pub.school : '');
  const saved = store.get('nb.parent');
  if (saved && saved.name && saved.phone) {
    app.innerHTML = header() + '<div class="loading"><span class="spin"></span> 우리 아이 수업 불러오는 중…</div>';
    try { await doLogin(saved.name, saved.phone, true); return; }
    catch (e) { store.del('nb.parent'); renderHome(e.message); return; }
  }
  renderHome();
}
if (PAGE === 'reg') history.replaceState({ view: '' }, '', location.pathname); // 예전 수강 등록 주소 → 첫 화면
else history.replaceState({ view: '' }, '', location.href);
boot();
})();
</script>
